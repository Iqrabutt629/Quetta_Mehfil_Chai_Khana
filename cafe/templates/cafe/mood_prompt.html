{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Quetta Mehfil - Mood</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; width: 350px; border-radius: 20px; box-shadow: 0 15px 35px rgba(211, 47, 47, 0.1); text-align: center; padding: 30px; box-sizing: border-box; }
        h2 { color: #d32f2f; text-transform: uppercase; margin: 0 0 20px 0; font-weight: bold; }
        select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #d32f2f; outline: none; cursor: pointer; margin-bottom: 20px; }
        .skip-link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .skip-link:hover { color: #d32f2f; }
    </style>
</head>
<body>

<div style="background-color: #d32f2f; padding: 0 20px; display: flex; align-items: center; position: fixed; top: 0; left: 0; width: 100%; z-index: 10000; height: 56px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-shadow: 0px 2px 5px rgba(0,0,0,0.2); box-sizing: border-box;">
    
    <div onclick="toggleSidebar()" style="cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; width: 22px; height: 16px; position: absolute; left: 20px; z-index: 10002;">
        <span style="height: 3px; width: 100%; background-color: #ffffff; border-radius: 2px;"></span>
        <span style="height: 3px; width: 100%; background-color: #ffffff; border-radius: 2px;"></span>
        <span style="height: 3px; width: 100%; background-color: #ffffff; border-radius: 2px;"></span>
    </div>

    <div style="width: 100%; text-align: center;">
        <h2 style="color: #ffffff; margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;">
            Mood Recommendation
        </h2>
    </div>
</div>

<div id="leftSidebar" style="position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background-color: #b71c1c; z-index: 10005; transition: 0.3s ease; padding-top: 20px; box-shadow: 2px 0px 10px rgba(0,0,0,0.3); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-sizing: border-box;">
    <div onclick="toggleSidebar()" style="color: #ffffff; font-size: 24px; position: absolute; top: 15px; right: 20px; cursor: pointer; font-weight: bold;">
        &times;
    </div>

    <div style="margin-top: 60px; display: flex; flex-direction: column;">
        <a href="/welcome/" style="color: white; padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500;">Welcome</a>
        <a href="/menu/" style="color: white; padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500;">Menu</a>
        <a href="/mood-prompt/" style="color: white; background-color: rgba(255,255,255,0.1); padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500; border-left: 4px solid #ffffff;">Mood Recommendation</a>
        <a href="/deals/" style="color: white; padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500;">Deals</a>
        <a href="/favourites/" style="color: white; padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500;">Favourites</a>
        <a href="/cart/" style="color: white; padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500;">Add to Cart</a>
        <a href="/about_us/" style="color: white; padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500;">About Us</a>
        <a href="/logout/" style="color: white; padding: 15px 25px; text-decoration: none; font-size: 18px; font-weight: 500; margin-top: 30px;">Logout</a>
    </div>
</div>

<div id="sidebarOverlay" onclick="toggleSidebar()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); z-index: 10004;"></div>

<div class="container" style="margin-top: 56px;">
    <h2>Aaj aapka mood kaisa hai?</h2>

    <select id="userMood" onchange="checkMood()">
        <option value=""> Apna Mood Select karein </option>
        <option value="happy">Happy (Bohat Khush)</option>
        <option value="stress">Stressed (Udaas Ho)</option>
        <option value="romantic">Romantic (Mood acha hai)</option>
        <option value="sleepy">Sleepy (Neend aa rahi hai)</option>
    </select>

    <div id="recommendation" style="margin: 15px 0; font-weight: bold; color: #b71c1c; min-height: 20px;"></div>

    <a href="{% url 'menu' %}" class="skip-link">If you don't want our recommendation then go to Menu</a>
</div>

<script>
function toggleSidebar() {
    var sidebar = document.getElementById("leftSidebar");
    var overlay = document.getElementById("sidebarOverlay");
    if (sidebar.style.left === "0px") {
        sidebar.style.left = "-250px";
        overlay.style.display = "none";
    } else {
        sidebar.style.left = "0px";
        overlay.style.display = "block";
    }
}

function checkMood() {
    var mood = document.getElementById('userMood').value;
    var msg = document.getElementById('recommendation');

    if (mood === "happy") {
        msg.innerHTML = "Zabardast! Aapke liye hamari Chocolate Chai behtareen rahegi!";
    } else if (mood === "stress") {
        msg.innerHTML = "Pareshan na hon, Elaichi wali chai piyein, sab theek ho jayega!";
    } else if (mood === "romantic") {
        msg.innerHTML = "Wao! Phir toh Peshawari Qehwa ya Kashmiri Chai banti hai!";
    } else if (mood === "sleepy") {
        msg.innerHTML = "Uth jayein! Ek Strong Kadak chai aapki neend ura degi!";
    } else {
        msg.innerHTML = "";
        return;
    }

    setTimeout(function() {
        window.location.href = "/mood_selector/?mood=" + mood;
    }, 2000);
}
</script>
<style>
    #leftSidebar a:hover {
        color: #ffffff !important;
        background-color: rgba(255,255,255,0.05);
        padding-left: 30px !important;
        transition: 0.2s;
    }
</style>
</body>
</html>
